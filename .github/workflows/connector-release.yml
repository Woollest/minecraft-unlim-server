name: Build Connector release

on:
  push:
    tags:
      - "connector-v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: connector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: connector/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: connector/src-tauri
      - run: npm ci
      - run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.CONNECTOR_TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
      - name: Prepare stable updater metadata
        shell: pwsh
        run: |
          $config = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*setup.exe | Select-Object -First 1
          $signature = (Get-Content ($installer.FullName + ".sig") -Raw).Trim()
          New-Item -ItemType Directory -Path release-staging -Force | Out-Null
          Copy-Item $installer.FullName release-staging/Woollest.SMP.Connector_x64-setup.exe
          Copy-Item ($installer.FullName + ".sig") release-staging/Woollest.SMP.Connector_x64-setup.exe.sig
          $metadata = @{
            version = $config.version
            notes = "Unlim自動導入・更新とConnector自動更新を含む最新版です。"
            pub_date = (Get-Date).ToUniversalTime().ToString("o")
            platforms = @{
              "windows-x86_64" = @{
                signature = $signature
                url = "https://github.com/Woollest/minecraft-unlim-server/releases/download/connector-latest/Woollest.SMP.Connector_x64-setup.exe"
              }
            }
          }
          $metadata | ConvertTo-Json -Depth 5 | Set-Content release-staging/connector-latest.json -Encoding utf8
      - uses: softprops/action-gh-release@v2
        with:
          name: Woollest SMP Connector ${{ github.ref_name }}
          body: |
            参加者向けのWindows接続アプリです。

            1. Connectorを起動するとUnlim公式版が自動導入・更新されます。
            2. Discordの接続情報に掲載された招待キーを入力します。
            3. Minecraft Java版から `127.0.0.1:25565` に接続します。

            招待キーは保存されません。ダウンロードしたUnlimは公式SHA-256で検証されます。
          files: |
            connector/src-tauri/target/release/bundle/nsis/*.exe
            connector/src-tauri/target/release/bundle/nsis/*.sig
            connector/src-tauri/target/release/bundle/msi/*.msi
            connector/src-tauri/target/release/bundle/msi/*.sig
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: connector-latest
          name: Woollest SMP Connector Latest
          prerelease: true
          overwrite_files: true
          files: connector/release-staging/*
