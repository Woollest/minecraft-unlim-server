# Woollest Minecraft Server - custom quests
# UTF-8で保存してください。変更後は `make quests-deploy` で反映します。
quests:
  stone_miner:
    name: '<gold>石材調達'
    ask-message: '<yellow>石を64個採掘しよう。'
    finish-message: '<green>石材調達完了！ 鉄インゴットを受け取りました。'
    redo-delay: 1440
    stages:
      ordered:
        1:
          break-block-names: [STONE]
          break-block-amounts: [64]
          break-block-durability: [0]
    rewards:
      items:
        - ==: org.bukkit.inventory.ItemStack
          type: IRON_INGOT
          amount: 8
      exp: 50
      quest-points: 1

